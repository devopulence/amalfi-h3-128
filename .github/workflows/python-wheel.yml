name: Python wheel

on:
  push:
    branches: [feat/h3-128-mvp, master]
    tags: ["v*-python-bindings", "v*-manylinux-wheel", "v*-multiarch-wheel"]
  pull_request:
    branches: [feat/h3-128-mvp, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build + test ${{ matrix.runner }} (${{ matrix.arch }}) manylinux2014
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            image: quay.io/pypa/manylinux2014_x86_64
            docker_platform: linux/amd64
            audit_plat: manylinux2014_x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            image: quay.io/pypa/manylinux2014_aarch64
            docker_platform: linux/arm64
            audit_plat: manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build + audit + test wheel inside ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/h-home \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            ${{ matrix.image }} \
            bash -euo pipefail -c '
              mkdir -p "$HOME"
              export PATH=/opt/python/cp311-cp311/bin:$PATH
              echo "--- toolchain ---"
              which cmake && cmake --version | head -1
              which gcc && gcc --version | head -1
              which auditwheel && auditwheel --version
              which python && python --version

              echo "--- pip install ---"
              python -m pip install --no-cache-dir --upgrade pip build cffi pytest h3

              echo "--- cmake configure ---"
              mkdir -p build-release && cd build-release
              cmake .. \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_TESTING=OFF \
                -DBUILD_BENCHMARKS=OFF \
                -DBUILD_FILTERS=OFF \
                -DBUILD_GENERATORS=OFF
              cmake --build . -j --target h3

              echo "--- stage libh3 ---"
              cd ..
              src="$(find build-release/lib -maxdepth 1 -type f -name "libh3.so.[0-9]*" | head -1)"
              if [ -z "$src" ]; then
                echo "ERROR: did not find versioned libh3.so in build-release/lib" >&2
                ls -la build-release/lib >&2
                exit 1
              fi
              echo "Staging $src as h3_extended/libh3_extended.so"
              cp "$src" h3_extended/libh3_extended.so

              echo "--- build wheel ---"
              python -m build --wheel

              echo "--- auditwheel show (pre-repair) ---"
              auditwheel show dist/h3_extended-*linux_${{ matrix.arch }}.whl

              echo "--- auditwheel repair --plat ${{ matrix.audit_plat }} ---"
              auditwheel repair --plat ${{ matrix.audit_plat }} -w dist/ \
                dist/h3_extended-*linux_${{ matrix.arch }}.whl
              rm dist/h3_extended-*-linux_${{ matrix.arch }}.whl
              ls -la dist/

              echo "--- inspect wheel contents ---"
              wheel="$(ls dist/h3_extended-*.whl | head -1)"
              python -m zipfile -l "$wheel" | awk "{print \$1}" | grep -E "\.(so|dylib)$" || (
                echo "ERROR: wheel does not bundle a shared library" >&2
                python -m zipfile -l "$wheel" >&2
                exit 1
              )

              echo "--- install into fresh venv + pytest ---"
              python -m venv /tmp/venv-wheel
              /tmp/venv-wheel/bin/pip install --no-cache-dir --upgrade pip
              /tmp/venv-wheel/bin/pip install --no-cache-dir \
                dist/h3_extended-*manylinux*.whl pytest h3
              cd /tmp
              /tmp/venv-wheel/bin/pytest --pyargs h3_extended.tests -v
            '

      - name: Upload Linux wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: h3_extended-${{ matrix.runner }}-${{ matrix.arch }}-py311
          path: dist/h3_extended-*.whl
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build + test macos-latest (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build deps
        run: python -m pip install --upgrade pip build cffi pytest h3

      - name: Configure release build
        run: |
          mkdir build-release
          cd build-release
          cmake .. \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_FILTERS=OFF \
            -DBUILD_GENERATORS=OFF

      - name: Build C library
        run: cmake --build build-release -j --target h3

      - name: Stage shared library into Python package
        shell: bash
        run: |
          set -euo pipefail
          src="$(find build-release/lib -maxdepth 1 -type f -name 'libh3.[0-9]*.dylib' | head -1)"
          if [ -z "$src" ]; then
            echo "ERROR: did not find versioned libh3.dylib in build-release/lib" >&2
            ls -la build-release/lib >&2
            exit 1
          fi
          echo "Staging $src as h3_extended/libh3_extended.dylib"
          cp "$src" "h3_extended/libh3_extended.dylib"
          install_name_tool -id "@rpath/libh3_extended.dylib" "h3_extended/libh3_extended.dylib"

      - name: Build wheel
        run: python -m build --wheel

      - name: Inspect wheel contents
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/h3_extended-*.whl | head -1)"
          echo "Wheel: $wheel"
          python -m zipfile -l "$wheel" | awk '{print $1}' | grep -E '\.(so|dylib)$' || (
            echo "ERROR: wheel does not bundle a shared library" >&2
            python -m zipfile -l "$wheel" >&2
            exit 1
          )

      - name: Install wheel into a clean venv and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install --upgrade pip
          /tmp/venv-wheel/bin/pip install dist/h3_extended-*.whl pytest h3
          cd /tmp
          /tmp/venv-wheel/bin/pytest --pyargs h3_extended.tests -v

      - name: Upload macOS wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: h3_extended-macos-latest-arm64-py311
          path: dist/h3_extended-*.whl
          if-no-files-found: error
          retention-days: 30